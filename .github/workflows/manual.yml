name: Incidencias de carreteras

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar datos oficiales
        run: |
          curl -fL --max-time 60 "https://www.gencat.cat/transit/opendata/incidenciesRSS.xml" -o incidencias.xml
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('incidencias.xml').getroot(); assert r.tag == 'rss'; print('RSS recibido'); print(E.tostring(r, encoding='unicode')[:5000])"
