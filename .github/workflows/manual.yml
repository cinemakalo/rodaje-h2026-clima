name: Incidencias de carreteras

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar datos oficiales
        run: |
          curl -fL --max-time 60 "https://www.gencat.cat/transit/opendata/incidenciesRSS.xml" -o incidencias.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("incidencias.xml").getroot()
          assert root.tag == "rss"
          for item in root.findall("./channel/item"):
              title = item.findtext("title", "")
              desc = item.findtext("description", "")
              road = desc.split("|")[0].strip()
              if road in ["C-28", "N-230", "C-142b"]:
                  print(title, "|", desc)
          PY
