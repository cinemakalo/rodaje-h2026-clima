
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:2px;font-family:Arial,sans-serif;color:#172b3a}
.card{display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid #d7e2e9;border-radius:7px;font-size:12px;color:#172b3a;text-decoration:none;white-space:nowrap}
#icon{font-size:15px}
.item{padding:7px 4px;border-bottom:1px solid #d7e2e9;font-size:13px}
.item p{margin:4px 0;font-size:12px}
.item small{font-size:11px;line-height:1.3}
h2{margin:8px 0;font-size:18px}
small{color:#64748b}
.contingencia{background:#eef5ff;border:1px solid #b8d3f5;border-radius:7px;padding:10px;margin:8px 0;font-size:12px;line-height:1.5}
</style>
</head>
<body>

<a class="card" id="card" target="_blank" rel="noopener">
<strong>ESTADO DE LAS VÍAS</strong>
<span id="icon">⚪</span>
</a>

<section id="report" hidden></section>

<script>
const params=new URLSearchParams(location.search);
const key=params.get("site")||"aiguamog";
const detail=params.get("detalle")==="1";

const roads={
  aiguamog:["L-313a","L-313","C-1412a","C-14","C-1412b","C-13","N-260","C-28"]
};

const names={
  aiguamog:"GUISSONA → AIGUAMÒG"
};

const tramos={
  "C-13":[[85,99.358],[127.850,157.966]],
  "C-28":[[33,67]]
};

const card=document.getElementById("card");
const icon=document.getElementById("icon");
const report=document.getElementById("report");

const LIMITE=45*60*1000;
const CACHE="rodaje_h2026_incidencias";
let ultimoInforme=null;
let consultando=false;

card.href="?site="+encodeURIComponent(key)+"&detalle=1";

function add(tag,text,parent){
  const el=document.createElement(tag);
  el.textContent=text;
  parent.appendChild(el);
  return el;
}

function fechaFuente(d){
  return Date.parse(
    String(d.fecha_fuente||"")
      .replace(/ CET$/," +0100")
      .replace(/ CEST$/," +0200")
  );
}

function valido(d){
  return d &&
    Array.isArray(d.incidencias) &&
    Number.isFinite(Date.parse(d.actualizado)) &&
    Number.isFinite(fechaFuente(d));
}

function formatoFecha(fecha){
  return new Date(fecha).toLocaleString(
    "es-ES",{timeZone:"Europe/Madrid"}
  );
}

function guardar(d){
  ultimoInforme=d;
  try{
    localStorage.setItem(CACHE,JSON.stringify(d));
  }catch(e){}
}

function recuperar(){
  if(valido(ultimoInforme))return ultimoInforme;
  try{
    const d=JSON.parse(localStorage.getItem(CACHE));
    if(valido(d))return d;
  }catch(e){}
  return null;
}

function mostrar(d,sinConexion=false){
  if(!valido(d)||!roads[key])throw Error();

  const ahora=Date.now();
  const age=ahora-Date.parse(d.actualizado);
  const sourceAge=ahora-fechaFuente(d);

  const antiguo=
    sinConexion ||
    age<0 ||
    sourceAge<0 ||
    age>LIMITE ||
    sourceAge>LIMITE;

  const items=d.incidencias.filter(i=>{
    const via=String(i.via||"").toUpperCase();

    if(!roads[key].some(v=>v.toUpperCase()===via))
      return false;

    const pk=String(i.descripcion||"").match(
      /Punt km\.\s*(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)/i
    );

    if(!pk||!tramos[via])return true;

    const a=Number(pk[1].replace(",","."));
    const b=Number(pk[2].replace(",","."));
    const inicio=Math.min(a,b);
    const fin=Math.max(a,b);

    return tramos[via].some(([min,max])=>
      inicio<=max&&fin>=min
    );
  });

  items.sort((a,b)=>
    Number(b.estado==="rojo")-Number(a.estado==="rojo")
  );

  const estadoOriginal=items.some(i=>i.estado==="rojo")
    ?"🔴":items.length?"🟡":"🟢";

  icon.textContent=antiguo?"🔵":estadoOriginal;

  card.title=antiguo
    ?"Último informe disponible. Datos desactualizados."
    :"Consultar incidencias";

  if(!detail)return;

  report.replaceChildren();

  add("h2",names[key]||"ESTADO DE LAS VÍAS",report);

  if(antiguo){
    const aviso=add("div","",report);
    aviso.className="contingencia";

    add("strong","🔵 ÚLTIMO INFORME DISPONIBLE",aviso);

    add("p",
      "Información desactualizada. Se conservan las últimas incidencias notificadas.",
      aviso
    );

    if(sinConexion){
      add("p",
        "No ha sido posible obtener una actualización. Se muestra una copia de respaldo.",
        aviso
      );
    }

    if(sourceAge>=0){
      add("p",
        "Antigüedad del informe oficial: "+
        Math.floor(sourceAge/60000)+" minutos.",
        aviso
      );
    }else{
      add("p","No se puede verificar la antigüedad del informe.",aviso);
    }

    add("p",
      "Consultar Trànsit antes de iniciar el desplazamiento.",
      aviso
    );
  }

  add("p",
    estadoOriginal+" "+items.length+
    (antiguo?" incidencias del último informe":" incidencias notificadas"),
    report
  );

  add("small",
    "Último informe oficial: "+formatoFecha(fechaFuente(d)),
    report
  );

  add("p",
    "Última descarga: "+formatoFecha(d.actualizado),
    report
  );

  items.forEach(i=>{
    const box=add("div","",report);
    box.className="item";

    add("strong",
      (i.estado==="rojo"?"🔴 ":"🟡 ")+i.via,
      box
    );

    add("p",i.titulo,box);
    add("small",i.descripcion,box);
  });

  if(!items.length){
    add("p",
      antiguo
        ?"El último informe no contenía incidencias en los tramos consultados. Se desconoce el estado actual."
        :"Sin incidencias notificadas en los tramos y vías consultados.",
      report
    );
  }

  pieInforme();
}

function pieInforme(){
  add("p",
    "Aviso: filtros kilométricos provisionales en la C-13 y la C-28. Las demás carreteras se consultan completas. Algunas incidencias pueden quedar fuera del recorrido. Los accesos locales no están verificados. La ausencia de alertas no garantiza que la vía sea transitable. Información del último informe disponible, no previsión para la fecha de rodaje.",
    report
  );

  const link=add("a","Consultar fuente oficial: Trànsit",report);
  link.href="https://cit.transit.gencat.cat/";
  link.target="_blank";
  link.rel="noopener";
}

function sinDatos(){
  icon.textContent="⚪";
  card.title="Sin información disponible";

  if(detail){
    report.replaceChildren();
    add("h2",names[key]||"ESTADO DE LAS VÍAS",report);
    add("p","⚪ No hay información disponible.",report);
    pieInforme();
  }
}

async function actualizar(){
  if(consultando)return;
  consultando=true;

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),12000);

  try{
    const r=await fetch(
      "https://raw.githubusercontent.com/cinemakalo/rodaje-h2026-clima/main/incidencias.json?t="+Date.now(),
      {
        cache:"no-store",
        signal:controller.signal
      }
    );

    if(!r.ok)throw Error();

    const d=await r.json();

    if(!valido(d))throw Error();

    const anterior=recuperar();

    if(anterior &&
       fechaFuente(anterior)>fechaFuente(d)){
      mostrar(anterior,true);
    }else{
      guardar(d);
      mostrar(d);
    }

  }catch(e){
    const respaldo=recuperar();

    if(respaldo){
      try{
        mostrar(respaldo,true);
      }catch(e){
        sinDatos();
      }
    }else{
      sinDatos();
    }
  }finally{
    clearTimeout(timeout);
    consultando=false;
  }
}

if(detail){
  card.hidden=true;
  card.style.display="none";
  report.hidden=false;
}

const respaldoInicial=recuperar();

if(respaldoInicial){
  try{
    mostrar(respaldoInicial,true);
  }catch(e){}
}

actualizar();
setInterval(actualizar,60000);
</script>
</body>
</html>
